<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Livro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📚 Minha Biblioteca</a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                {% if livro %}
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <span class="badge bg-secondary mb-2">ID #{{ livro.id }}</span>
                        <h1 class="card-title text-primary h2 mb-1">{{ livro.titulo }}</h1>
                        <p class="fs-5 text-muted mb-4">por {{ livro.autor }}</p>
                        
                        <hr class="text-muted">

                        <h2 class="h6 text-uppercase text-secondary fw-bold">Sinopse</h2>
                        <p class="card-text leading-relaxed">{{ livro.descricao }}</p>

                        <div class="mt-4 pt-2">
                            <a href="/" class="btn btn-outline-secondary">
                                &larr; Voltar para o catálogo
                            </a>
                        </div>
                    </div>
                </div>
                {% else %}
                <div class="alert alert-warning shadow-sm" role="alert">
                    <h4 class="alert-heading">Ops! Livro não encontrado.</h4>
                    <p class="mb-0">O livro solicitado não existe na base de dados.</p>
                    <hr>
                    <a href="/" class="btn btn-warning">Voltar ao início</a>
                </div>
                {% endif %}

            </div>
        </div>
    </main>

</body>
</html>
