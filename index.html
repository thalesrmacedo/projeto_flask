<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Livros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📚 Minha Biblioteca</a>
        </div>
    </nav>

    <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 text-secondary mb-0">Livros Disponíveis</h1>
            <span class="badge bg-primary rounded-pill">{{ livros|length }} títulos</span>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for livro in livros %}
            <div class="col">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title text-primary fw-bold">{{ livro.titulo }}</h5>
                        <h6 class="card-subtitle mb-3 text-muted">por {{ livro.autor }}</h6>
                        <p class="card-text text-truncate">{{ livro.descricao }}</p>
                        <a href="/livro/{{ livro.id }}" class="btn btn-outline-primary mt-auto w-100">
                            Ver detalhes
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

</body>
</html>
